<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>媒体嗅探下载器</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 400px;
        max-height: 560px;
        overflow: hidden;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1c1f24;
        }
      }
      #app {
        height: 420px;
        display: flex;
        flex-direction: column;
      }
      #app > .mg-root {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      #app .mg-panel {
        flex: 1;
        min-height: 0;
      }
      details.settings {
        border-top: 1px solid #e6e8ec;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 13px;
        color: #1b1d21;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        details.settings {
          border-color: #33383f;
          color: #e8eaed;
          background: #1c1f24;
        }
      }
      details.settings > summary {
        padding: 8px 12px;
        cursor: pointer;
        color: #6b7280;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 8px;
      }
      .row label {
        flex: 1;
      }
      .row input[type="text"],
      .row select {
        width: 120px;
        padding: 4px 6px;
        border: 1px solid #e6e8ec;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .tip {
        padding: 0 12px 10px;
        color: #6b7280;
        line-height: 1.6;
      }
      .tip code {
        background: rgba(127, 127, 127, 0.15);
        padding: 0 3px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <details class="settings">
      <summary>设置</summary>
      <div class="row">
        <label for="folder">保存子目录</label>
        <input id="folder" type="text" placeholder="如 MediaGrabber" />
      </div>
      <div class="row">
        <label for="concurrency">分片并发数</label>
        <select id="concurrency">
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8">8</option>
        </select>
      </div>
      <div class="row">
        <label for="referer">抓取时带上页面 Referer</label>
        <input id="referer" type="checkbox" />
      </div>
      <div class="row">
        <label for="autoclose">抓完自动关闭抓取页</label>
        <input id="autoclose" type="checkbox" />
      </div>
      <div class="tip">
        手机上的 Edge 里没有工具栏弹窗，请直接用网页里那个悬浮按钮；
        这个弹窗主要在桌面版 Edge 上使用。
      </div>
    </details>
    <script src="ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
